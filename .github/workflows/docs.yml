name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'examples/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds packages, the docs site, and the example demos (turbo orders deps).
      - name: Build everything
        run: pnpm build
      - name: Assemble Pages site (docs + demos)
        run: |
          rm -rf site
          mkdir -p site/examples/react site/examples/vanilla
          cp -r apps/docs/.vitepress/dist/. site/
          cp -r examples/react/dist/. site/examples/react/
          cp -r examples/vanilla/dist/. site/examples/vanilla/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
